replicaCount: 1

image:
  repository: git-agent
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8001

# Set to the in-cluster address of the separately deployed GitHub MCP Server.
githubMcpUrl: http://github-mcp:8082/
model: gemini-3.6-flash
# Google recommends 1.0 for Gemini 3; lower values can degrade reasoning.
temperature: "1.0"
existingSecret: ""
# Secret containing a PostgreSQL URL in A2A_TASK_DATABASE_URL.
existingTaskDatabaseSecret: ""
taskDatabaseSecretKey: A2A_TASK_DATABASE_URL
# Secret containing a GitHub PAT or other bearer token accepted by GitHub MCP.
existingGithubMcpSecret: ""
githubMcpSecretKey: GITHUB_MCP_TOKEN
extraEnv: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
