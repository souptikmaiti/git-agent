replicaCount: 1

image:
  repository: git-agent
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8001

gitmcpUrl: https://gitmcp.io/docs
model: gemini-3.6-flash
# Google recommends 1.0 for Gemini 3; lower values can degrade reasoning.
temperature: "1.0"
existingSecret: ""
extraEnv: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
